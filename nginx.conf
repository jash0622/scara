# ============================================================================
# SCARA — Nginx Production Config
# Deploy to: /etc/nginx/sites-available/scara
# Enable:    sudo ln -s /etc/nginx/sites-available/scara /etc/nginx/sites-enabled/
# ============================================================================

# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m   rate=5r/m;

# ── Upstream definitions ──────────────────────────────────────────────────────
upstream backend  { server 127.0.0.1:4000; keepalive 32; }
upstream frontend { server 127.0.0.1:3000; keepalive 16; }
upstream admin    { server 127.0.0.1:3001; keepalive 8;  }

# ── HTTP → HTTPS redirect (all domains) ──────────────────────────────────────
server {
    listen 80;
    server_name scara.gg www.scara.gg api.scara.gg admin.scara.gg;
    return 301 https://$host$request_uri;
}

# ── api.scara.gg — Backend API ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.scara.gg;

    # SSL — filled in by Certbot automatically
    ssl_certificate     /etc/letsencrypt/live/api.scara.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.scara.gg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Body size limit for S3 presign requests (no direct uploads here)
    client_max_body_size 2m;

    # Health check — no rate limit
    location = /api/health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Auth login — strict rate limit (5 req/min per IP, mirrors backend limiter)
    location = /api/auth/login {
        limit_req zone=api_login burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # All other API routes — general rate limit
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 404 for anything not under /api/
    location / {
        return 404 '{"success":false,"error":{"message":"Not found","code":"NOT_FOUND"}}';
        add_header Content-Type application/json always;
    }
}

# ── scara.gg / www.scara.gg — Public Frontend ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name scara.gg www.scara.gg;

    # Redirect www → apex
    if ($host = www.scara.gg) {
        return 301 https://scara.gg$request_uri;
    }

    # SSL — filled in by Certbot automatically
    ssl_certificate     /etc/letsencrypt/live/scara.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scara.gg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    client_max_body_size 2m;

    # Next.js standalone static assets (_next/static) — served directly with long cache
    location /_next/static/ {
        alias /home/ubuntu/scara/Frontend/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public folder static files (images, fonts, etc.)
    location /public/ {
        alias /home/ubuntu/scara/Frontend/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else → Next.js SSR
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── admin.scara.gg — Admin Panel ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.scara.gg;

    # SSL — filled in by Certbot automatically
    ssl_certificate     /etc/letsencrypt/live/admin.scara.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.scara.gg/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers — stricter for admin
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "no-referrer"                         always;
    add_header X-Robots-Tag              "noindex, nofollow"                   always;

    client_max_body_size 15m;

    # Next.js standalone static assets for admin
    location /_next/static/ {
        alias /home/ubuntu/scara/Admin/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else → Next.js SSR
    location / {
        proxy_pass         http://admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
